[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.1.0"
description = "A provider-neutral CLI chatbot for experimenting with LLMs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]
local = [
    "llama-cpp-python>=0.3.16,<0.4",
]
benchmark = [
    "psutil>=6,<8",
]

[project.scripts]
chatbot = "chatbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"